# Local dev infrastructure for the planned .NET backend (DOTNET_BACKEND_PLAN.md).
# SQL Server has no native macOS/ARM build — this runs the linux/amd64 image
# under Colima + Rosetta. The .NET API itself is run on the host with
# `dotnet watch`, not in a container (see DOTNET_FRONTEND_CONTRACT.md notes).
#
#   colima start --cpu 4 --memory 6 --disk 40 --vm-type=vz --vz-rosetta
#   docker compose up -d
#   docker compose stop        # when not in use
#
# Connection string (appsettings.Development.json):
#   Server=localhost,1433;Database=ClinicAppDb;User Id=sa;Password=Clinic_Dev_Pass123;TrustServerCertificate=True

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    container_name: clinic-mssql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Clinic_Dev_Pass123"
      MSSQL_PID: "Express"
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -No -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  mssql-data:
